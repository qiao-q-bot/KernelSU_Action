name: OneClick Build OnePlus 6T 4.9 Kernel + KernelSU

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch'
        default: 'oneplus/SDM845_P_9.0'
        required: true
      kernelsu_tag:
        description: 'KernelSU tag/version'
        default: 'v0.9.5'
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git wget curl unzip bc bison flex libssl-dev ccache zip fastboot

    - name: Set environment variables
      run: |
        # Kernel source
        export KERNEL_SOURCE=https://github.com/OnePlusOSS/android_kernel_oneplus_sdm845
        export KERNEL_SOURCE_BRANCH=${{ github.event.inputs.kernel_branch }}
        export KERNEL_CONFIG=vendor/fajita_defconfig
        export KERNEL_IMAGE_NAME=Image.gz-dtb
        export ARCH=arm64

        # Compiler
        export USE_CUSTOM_GCC_64=true
        export CUSTOM_GCC_64_SOURCE=https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-7.3.1
        export CUSTOM_GCC_64_BRANCH=lineage-16.0
        export CUSTOM_GCC_64_BIN=aarch64-linux-android-
        export USE_CUSTOM_GCC_32=true
        export CUSTOM_GCC_32_SOURCE=https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-7.3.1
        export CUSTOM_GCC_32_BRANCH=lineage-16.0
        export CUSTOM_GCC_32_BIN=arm-linux-androideabi-

        # KernelSU
        export ENABLE_KERNELSU=true
        export APPLY_KSU_PATCH=true
        export KERNELSU_TAG=${{ github.event.inputs.kernelsu_tag }}

        # AnyKernel3
        export CUSTOM_ANYKERNEL3_SOURCE=https://github.com/osm0sis/AnyKernel3
        export CUSTOM_ANYKERNEL3_BRANCH=master

        # Other
        export NEED_DTBO=true
        export SOURCE_BOOT_IMAGE=https://github.com/LineageOS/android_device_oneplus_fajita/raw/lineage-16.0/boot.img
        export ENABLE_CCACHE=true

    - name: Setup ccache
      run: |
        if [ "$ENABLE_CCACHE" = "true" ]; then
          export CCACHE_DIR=$HOME/.ccache
          ccache -M 10G
          ccache -s
        fi

    - name: Download GCC 64-bit
      if: env.USE_CUSTOM_GCC_64 == 'true'
      run: git clone --depth=1 -b $CUSTOM_GCC_64_BRANCH $CUSTOM_GCC_64_SOURCE prebuilts/gcc64

    - name: Download GCC 32-bit
      if: env.USE_CUSTOM_GCC_32 == 'true'
      run: git clone --depth=1 -b $CUSTOM_GCC_32_BRANCH $CUSTOM_GCC_32_SOURCE prebuilts/gcc32

    - name: Download Kernel Source
      run: git clone --depth=1 -b $KERNEL_SOURCE_BRANCH $KERNEL_SOURCE kernel

    - name: Apply KernelSU patch
      if: env.APPLY_KSU_PATCH == 'true'
      run: |
        echo "Downloading and applying KernelSU patch..."
        curl -L https://github.com/tiann/KernelSU/releases/download/$KERNELSU_TAG/ksu.patch -o ksu.patch
        patch -p1 -d kernel < ksu.patch

    - name: Download DTBO image
      if: env.NEED_DTBO == 'true'
      run: wget -O dtbo.img $SOURCE_BOOT_IMAGE

    - name: Build Kernel
      run: |
        cd kernel
        export PATH=$PWD/../prebuilts/gcc64/bin:$PWD/../prebuilts/gcc32/bin:$PATH
        export ARCH=$ARCH
        export CROSS_COMPILE=$CUSTOM_GCC_64_BIN
        [ -n "$CCACHE_DIR" ] && export CCACHE_DIR
        make $KERNEL_CONFIG
        make -j$(nproc) $KERNEL_IMAGE_NAME

    - name: Build boot.img with AnyKernel3
      run: |
        git clone --depth=1 -b $CUSTOM_ANYKERNEL3_BRANCH $CUSTOM_ANYKERNEL3_SOURCE AnyKernel3
        cp kernel/$KERNEL_IMAGE_NAME AnyKernel3/
        cp -r kernel/arch/arm64/boot/dts/qcom AnyKernel3/dtbs/
        [ -f dtbo.img ] && cp dtbo.img AnyKernel3/
        cd AnyKernel3
        zip -r boot.zip *
        sha256sum boot.zip > boot.zip.sha256

    - name: Generate fastboot flash commands
      run: |
        echo "fastboot flash boot boot.zip" > flash_commands.txt
        echo "Optional: fastboot flash dtbo dtbo.img" >> flash_commands.txt
        echo "Optional: fastboot reboot" >> flash_commands.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: boot_artifacts
        path: |
          AnyKernel3/boot.zip
          AnyKernel3/boot.zip.sha256
          AnyKernel3/flash_commands.txt
